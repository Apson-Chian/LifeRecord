location ^~ /liferecord-api/ {
    if ($scheme = http) { return 308 https://apsonchian.ltd$request_uri; }
    add_header Strict-Transport-Security "max-age=2592000" always;
    client_max_body_size 8m;
    limit_req zone=liferecord_api burst=30 nodelay;
    limit_req_status 429;
    limit_conn liferecord_connections 20;
    proxy_pass http://127.0.0.1:18084/liferecord-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /liferecord { return 301 /liferecord/; }
location ^~ /liferecord/ {
    if ($scheme = http) { return 308 https://apsonchian.ltd$request_uri; }
    add_header Strict-Transport-Security "max-age=2592000" always;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
}
