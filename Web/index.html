<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4fb">
  <meta name="description" content="LifeRecord 与 iPhone 双向同步的饮食、营养、饮水与身体记录页面。">
  <title>LifeRecord · 今日记录</title>
  <link rel="stylesheet" href="styles.css?v=20260902-2">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="LifeRecord 首页">
        <span class="brand-mark">L</span>
        <span><strong>LifeRecord</strong><small>生活记录</small></span>
      </a>
      <div class="top-actions">
        <span class="sync-pill" id="syncStatus"><i></i>正在连接</span>
        <button class="date-button" id="dateButton" type="button" aria-haspopup="dialog">
          <span class="date-icon" aria-hidden="true">▦</span>
          <span id="dateLabel"></span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
    </header>

    <section class="desktop-toolbar" aria-label="桌面快捷操作">
      <div class="date-navigator">
        <button class="toolbar-icon" id="previousDayButton" type="button" aria-label="前一天">‹</button>
        <button class="toolbar-date" id="todayButton" type="button">
          <span>当前查看</span><strong id="toolbarDateLabel">今天</strong>
        </button>
        <button class="toolbar-icon" id="nextDayButton" type="button" aria-label="后一天">›</button>
      </div>
      <div class="toolbar-actions">
        <button class="toolbar-button" id="syncButton" type="button"><span aria-hidden="true">↻</span>立即同步</button>
        <button class="toolbar-button" id="searchMealButton" type="button"><span aria-hidden="true">⌕</span>查找记录 <kbd>/</kbd></button>
        <button class="toolbar-button" id="quickWeightButton" type="button">＋ 体重 <kbd>W</kbd></button>
        <button class="primary-button" id="quickMealButton" type="button">＋ 记一餐 <kbd>N</kbd></button>
      </div>
    </section>

    <section class="week-rings" id="weekRings" aria-label="本周每日营养进度"></section>

    <section class="overview-grid" aria-label="所选日期概览">
      <button class="overview-item calories-overview" type="button" data-open-detail="calories"><span>热量</span><strong id="overviewCalories">0</strong><small id="overviewCaloriesDetail">目标 2600 kcal</small><i><b id="overviewCaloriesBar"></b></i><em>查看来源 →</em></button>
      <button class="overview-item" type="button" data-open-detail="protein"><span>蛋白质</span><strong id="overviewProtein">0%</strong><small id="overviewProteinDetail">0 / 130 g</small><i><b id="overviewProteinBar"></b></i><em>查看来源 →</em></button>
      <button class="overview-item" type="button" data-open-detail="water"><span>饮水</span><strong id="overviewWater">0%</strong><small id="overviewWaterDetail">0 / 2800 ml</small><i><b id="overviewWaterBar"></b></i><em>查看来源 →</em></button>
      <button class="overview-item weight-overview" type="button" data-open-detail="weight"><span>体重</span><strong id="overviewWeight">--</strong><small id="overviewWeightDetail">暂无身体记录</small><em>查看来源 →</em></button>
    </section>

    <section class="home-grid">
      <article class="card meal-card">
        <div class="section-heading compact">
          <div><span class="eyebrow">饮食记录</span><h2 id="mealTitle">今天吃了什么</h2><p class="section-subtitle" id="mealSummary">0 餐</p></div>
          <div class="heading-actions"><button class="text-button" id="showMealsButton" type="button">查看详情</button><button class="primary-button" id="addMealButton" type="button">＋ 记一餐</button></div>
        </div>
        <div class="meal-list meal-preview" id="mealPreview"></div>
      </article>

      <aside class="card quick-card">
        <div class="section-heading compact"><div><span class="eyebrow">快捷记录</span><h2>今天还要记什么</h2></div></div>
        <button class="quick-detail water-quick" type="button" data-open-detail="water"><span class="quick-icon">●</span><span><small>今日饮水</small><strong><b id="waterTotal">0.0</b> L</strong></span><span class="quick-chevron">›</span></button>
        <div class="water-options compact-water-options" id="waterOptions" aria-label="常用饮水量"></div>
        <div class="quick-actions-grid"><button class="secondary-button" id="addWeightButton" type="button">＋ 记体重</button><button class="secondary-button" id="editGoalsButton" type="button">调整目标</button></div>
        <p class="privacy-note">首页只显示摘要。点击任一栏目可查看明细、记录时间与数据来源。</p>
      </aside>
    </section>

    <footer class="page-footer"><button class="text-button" id="exportButton" type="button">导出全部记录</button><span>·</span><button class="text-button" id="changeKeyButton" type="button">更换同步密钥</button></footer>
  </main>

  <dialog id="authDialog" class="modal auth-modal">
    <form id="authForm" class="modal-sheet">
      <div class="auth-mark">L</div><span class="eyebrow">PRIVATE SYNC</span><h2>连接你的 LifeRecord</h2>
      <p class="auth-copy">输入与 iPhone App“设置 → App 与浏览器同步”中相同的同步密钥。</p>
      <label>同步密钥<input name="token" type="password" autocomplete="current-password" required placeholder="粘贴私有同步密钥"></label>
      <p class="form-error" id="authError"></p>
      <button class="primary-button submit-button" type="submit">安全连接</button>
    </form>
  </dialog>

  <dialog id="calendarDialog" class="modal calendar-modal">
    <form method="dialog" class="modal-sheet">
      <div class="modal-top"><div><span class="eyebrow">浏览记录</span><h2>选择日期</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <div class="calendar-header"><button id="prevMonth" type="button" aria-label="上个月">‹</button><strong id="monthLabel"></strong><button id="nextMonth" type="button" aria-label="下个月">›</button></div>
      <div class="calendar-grid weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <p class="calendar-hint"><i class="record-dot"></i>绿点表示当天已有记录</p>
    </form>
  </dialog>

  <dialog id="mealDialog" class="modal">
    <form id="mealForm" class="modal-sheet">
      <div class="modal-top"><div><span class="eyebrow">新增记录</span><h2>记一餐</h2></div><button class="icon-button" id="closeMeal" type="button" aria-label="关闭">×</button></div>
      <label>餐次<select name="kind"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select></label>
      <label>餐食名称<input name="name" required placeholder="例如：鸡胸肉拌饭"></label>
      <div class="form-grid">
        <label>热量 kcal<input name="calories" required type="number" min="0" step="1" value="500"></label>
        <label>蛋白质 g<input name="protein" required type="number" min="0" step="1" value="30"></label>
        <label>碳水 g<input name="carbs" required type="number" min="0" step="1" value="60"></label>
        <label>脂肪 g<input name="fat" required type="number" min="0" step="1" value="15"></label>
      </div>
      <label>餐食照片（可选，最多 6 张）<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
      <p class="upload-hint">照片会加密传输并保存在你的私有服务器，浏览器只在查看历史记录时加载。</p>
      <button class="primary-button submit-button" type="submit">保存记录</button>
    </form>
  </dialog>

  <dialog id="weightDialog" class="modal">
    <form id="weightForm" class="modal-sheet">
      <div class="modal-top"><div><span class="eyebrow">身体记录</span><h2>记录体重</h2></div><button class="icon-button" id="closeWeight" type="button" aria-label="关闭">×</button></div>
      <label>体重 kg<input name="weight" required type="number" min="20" max="400" step="0.1" placeholder="64.0"></label>
      <label>体脂率 %（可选）<input name="bodyFat" type="number" min="1" max="80" step="0.1"></label>
      <label>备注<input name="note" placeholder="例如：晨起空腹"></label>
      <button class="primary-button submit-button" type="submit">保存身体数据</button>
    </form>
  </dialog>

  <dialog id="goalsDialog" class="modal">
    <form id="goalsForm" class="modal-sheet">
      <div class="modal-top"><div><span class="eyebrow">个人计划</span><h2>编辑每日目标</h2></div><button class="icon-button" id="closeGoals" type="button" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <label>热量 kcal<input name="calorieGoal" required type="number" min="500" max="10000"></label>
        <label>蛋白质 g<input name="proteinGoal" required type="number" min="1" max="600"></label>
        <label>碳水 g<input name="carbsGoal" required type="number" min="1" max="1200"></label>
        <label>脂肪 g<input name="fatGoal" required type="number" min="1" max="500"></label>
        <label>饮水 ml<input name="waterGoal" required type="number" min="500" max="10000"></label>
        <label>目标体重 kg<input name="targetWeight" required type="number" min="20" max="400" step="0.1"></label>
      </div>
      <button class="primary-button submit-button" type="submit">保存并同步</button>
    </form>
  </dialog>

  <dialog id="detailDialog" class="modal detail-modal">
    <div class="modal-sheet">
      <div class="modal-top"><div><span class="eyebrow" id="detailEyebrow">数据明细</span><h2 id="detailTitle">详情</h2><p class="detail-subtitle" id="detailSubtitle"></p></div><button class="icon-button" id="closeDetail" type="button" aria-label="关闭">×</button></div>
      <div class="detail-content" id="detailContent"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260902-2"></script>
</body>
</html>
